<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sy Click</title>
    <!-- استدعاء سكريبت تيليجرام ومكتبة Adsgram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121820;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            padding: 16px;
            text-align: center;
            background: #1a222d;
            border-bottom: 1px solid #2a3544;
        }
        .app-title {
            font-size: 18px;
            font-weight: 700;
            color: #38a5e0;
        }
        .score-container {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .score-val {
            font-size: 32px;
            font-weight: 800;
            color: #f5b300;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .tab-view {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .tab-view.active {
            display: flex;
        }
        /* واجهة النقر */
        .tap-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .bag-btn {
            background: none;
            border: none;
            font-size: 115px;
            cursor: pointer;
            transition: transform 0.08s ease;
            outline: none;
        }
        .bag-btn:active {
            transform: scale(0.90);
        }
        .ad-btn {
            background: linear-gradient(135deg, #2481cc, #1a5ea0);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 14px rgba(36, 129, 204, 0.35);
        }
        .ad-btn:active {
            transform: scale(0.98);
        }
        /* واجهة المهام */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .task-item {
            background: #1a222d;
            border: 1px solid #2a3544;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .task-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .task-reward {
            font-size: 13px;
            color: #f5b300;
            font-weight: 600;
        }
        .task-btn {
            background: #2a3544;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease, opacity 0.2s ease;
        }
        .task-btn.done {
            background: #27ae60 !important;
            opacity: 0.6 !important;
            cursor: default !important;
        }
        /* واجهة السحب */
        .wallet-card {
            background: #1a222d;
            border: 1px solid #2a3544;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-bottom: 16px;
        }
        .wallet-card p {
            color: #9ba5b3;
            font-size: 14px;
            line-height: 1.6;
        }
        /* شريط التنقل السفلي */
        .bottom-nav {
            display: flex;
            background: #161c24;
            border-top: 1px solid #2a3544;
            padding: 8px 0 16px 0;
        }
        .nav-item {
            flex: 1;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            color: #7b8898;
            cursor: pointer;
            border: none;
            background: none;
        }
        .nav-item.active {
            color: #38a5e0;
            font-weight: 700;
        }
        .nav-item span {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="app-title">Sy Click</div>
        <div class="score-container">
            <span class="score-val" id="score">0</span>
            <span style="font-size: 24px;">💰</span>
        </div>
    </div>

    <div class="main-content">
        <!-- الصفحة الرئيسية -->
        <div class="tab-view active" id="tab-game">
            <div class="tap-area">
                <button class="bag-btn" id="clickBtn">💰</button>
                <button class="ad-btn" id="adBtn">🎬 مكافأة إعلان (+5000 نقطة)</button>
            </div>
        </div>

        <!-- صفحة المهام -->
        <div class="tab-view" id="tab-tasks">
            <div class="task-list">
                <!-- مهمة القناة الرسمية -->
                <div class="task-item">
                    <div class="task-info">
                        <h4>انضم لقناة التطبيق الرسمية</h4>
                        <span class="task-reward">+2,500 نقطة</span>
                    </div>
                    <button id="task_channel" class="task-btn" onclick="executeChannelTask(this)">انضمام</button>
                </div>

                <!-- مهمة دعوة 5 أصدقاء -->
                <div class="task-item">
                    <div class="task-info">
                        <h4>دعوة 5 أصدقاء للبوت</h4>
                        <span class="task-reward">+10,000 نقطة</span>
                    </div>
                    <button id="task_invite" class="task-btn" onclick="executeInviteTask(this)">دعوة (0/5)</button>
                </div>
            </div>
        </div>

        <!-- صفحة السحب -->
        <div class="tab-view" id="tab-wallet">
            <div class="wallet-card">
                <h3 style="margin-bottom: 8px; color: #fff;">سحب الأرباح</h3>
                <p>يتم احتساب المكافآت وسحب الرصيد (سيرياتيل كاش / كاش) بناءً على إنجاز المهام والمشاهدات المؤكدة.</p>
                <div style="margin-top: 15px; font-weight: bold; color: #38a5e0;">
                    الحد الأدنى لطلب السحب: 100,000 نقطة
                </div>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('tab-game', this)">
            <span>🎮</span>الرئيسية
        </button>
        <button class="nav-item" onclick="switchTab('tab-tasks', this)">
            <span>📋</span>المهام
        </button>
        <button class="nav-item" onclick="switchTab('tab-wallet', this)">
            <span>💼</span>السحب
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // قراءة النقاط الحالية
        let score = parseInt(localStorage.getItem('syclick_score') || '0', 10);
        const scoreElement = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const adBtn = document.getElementById('adBtn');

        scoreElement.textContent = score.toLocaleString();

        // النقر على كيس النقود
        clickBtn.addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score.toLocaleString();
            localStorage.setItem('syclick_score', score);
        });

        // زر مشاهدة الإعلان
        adBtn.addEventListener('click', () => {
            if (typeof window.Adsgram === 'undefined') {
                alert("جاري الاتصال، يرجى المحاولة بعد لحظات.");
                return;
            }
            try {
                const adController = window.Adsgram.init({ blockId: "52772", debug: true });
                adController.show().then((result) => {
                    score += 5000;
                    scoreElement.textContent = score.toLocaleString();
                    localStorage.setItem('syclick_score', score);
                    alert("مبروك! تمت إضافة 5000 نقطة لمشاهدة الإعلان.");
                }).catch((err) => {
                    alert("حالة الوحدة: " + (err.description || JSON.stringify(err)));
                });
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        });

        // التبديل بين الواجهات
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        // سجل المهام المحفوظة
        const completedTasks = JSON.parse(localStorage.getItem('syclick_completed_tasks') || '[]');
        let inviteCount = parseInt(localStorage.getItem('syclick_invites') || '0', 10);

        function initTasks() {
            // تثبيت حالة القناة إذا أُنجزت مسبقاً
            if (completedTasks.includes('task_channel')) {
                const btn = document.getElementById('task_channel');
                if (btn) {
                    btn.textContent = "تم الانضمام ✓";
                    btn.classList.add('done');
                    btn.disabled = true;
                }
            }

            // تثبيت حالة الدعوة
            const inviteBtn = document.getElementById('task_invite');
            if (completedTasks.includes('task_invite')) {
                if (inviteBtn) {
                    inviteBtn.textContent = "تم الإنجاز ✓";
                    inviteBtn.classList.add('done');
                    inviteBtn.disabled = true;
                }
            } else if (inviteBtn) {
                inviteBtn.textContent = `دعوة (${inviteCount}/5)`;
            }
        }
        initTasks();

        // مهمة القناة الرسمية
        function executeChannelTask(btn) {
            if (completedTasks.includes('task_channel')) return;

            // فتح رابط قناتك الرسمية
            if (tg) {
                tg.openTelegramLink('https://t.me/Syclickchannel');
            } else {
                window.open('https://t.me/Syclickchannel', '_blank');
            }

            completedTasks.push('task_channel');
            localStorage.setItem('syclick_completed_tasks', JSON.stringify(completedTasks));

            score += 2500;
            scoreElement.textContent = score.toLocaleString();
            localStorage.setItem('syclick_score', score);

            btn.textContent = "تم الانضمام ✓";
            btn.classList.add('done');
            btn.disabled = true;
        }

        // مهمة دعوة 5 أصدقاء
        function executeInviteTask(btn) {
            if (completedTasks.includes('task_invite')) return;

            // فتح نافذة مشاركة الرابط عبر تيليجرام
            const shareUrl = 'https://t.me/share/url?url=https://t.me/Syclick_bot&text=انضم%20إلى%20تطبيق%20Sy%20Click%20واجمع%20النقاط%20والمكافآت%20اليومية!%20💰';
            if (tg) {
                tg.openTelegramLink(shareUrl);
            } else {
                window.open(shareUrl, '_blank');
            }

            // زيادة العداد تدريجياً
            if (inviteCount < 5) {
                inviteCount += 1;
                localStorage.setItem('syclick_invites', inviteCount);
                btn.textContent = `دعوة (${inviteCount}/5)`;
            }

            // التحقق من اكتمال الشرط (5/5)
            if (inviteCount >= 5) {
                completedTasks.push('task_invite');
                localStorage.setItem('syclick_completed_tasks', JSON.stringify(completedTasks));

                score += 10000;
                scoreElement.textContent = score.toLocaleString();
                localStorage.setItem('syclick_score', score);

                btn.textContent = "تم الإنجاز ✓";
                btn.classList.add('done');
                btn.disabled = true;
                alert("أحسنت! تمت إضافة 10,000 نقطة لإتمام دعوة 5 أصدقاء.");
            }
        }
    </script>
</body>
</html>
