<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syclick - Play & Earn</title>
    
    <!-- كود إعلان Popunder التلقائي من HilltopAds -->
    <script>
    (function(naifu){
    var d = document,
        s = d.createElement('script'),
        l = d.currentScript || d.scripts[d.scripts.length - 1];
    s.settings = naifu || {};
    s.src = "\/\/unfolded-uncle.com\/cOD.9Y6lbG2O5rliSXWVQn9\/NYz\/UCwwNKD-Y\/zDN\/yA0Q3hNHTJAa0CNIjGQNxr";
    s.async = true;
    s.referrerPolicy = 'no-referrer-when-downgrade';
    l.parentNode.insertBefore(s, l);
    })({})
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24; /* لون خلفية داكن أنيق */
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
        }
        /* الشريط العلوي */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #2b2b36;
            border-bottom: 2px solid #3a3a48;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff00; /* النقطة الخضراء */
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff00;
        }
        .popularity-badge {
            background-color: #ff9800;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 14px;
        }

        /* الرصيد والطاقة */
        .balance-container {
            margin-top: 30px;
        }
        .balance-amount {
            font-size: 48px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }
        .energy-container {
            margin-top: 10px;
            font-size: 20px;
            color: #4db8ff;
        }

        /* زر النقر الأساسي */
        .clicker-btn {
            width: 150px;
            height: 150px;
            margin: 30px auto;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 -5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .clicker-btn:active {
            transform: scale(0.95);
        }

        /* المهام والأزرار */
        .tasks-section {
            padding: 20px;
            background-color: #2b2b36;
            border-radius: 20px 20px 0 0;
            margin-top: 20px;
            text-align: right;
        }
        .task-item {
            background-color: #3a3a48;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .task-btn:hover { background-color: #45a049; }
        .energy-btn { background-color: #008CBA; }
        .withdraw-btn { background-color: #e74c3c; width: 100%; padding: 15px; margin-top: 10px; }
        
        .disabled {
            background-color: #7f8c8d !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="header">
        <div class="user-info">
            <div class="online-dot"></div>
            <span id="usernameDisplay">لاعب_Syclick</span>
        </div>
        <div class="popularity-badge">الشعبية: مستوى <span id="popLevel">1</span> 🏆</div>
    </div>

    <!-- الرصيد -->
    <div class="balance-container">
        <div class="balance-amount"><span id="balanceDisplay">0</span> 💰</div>
    </div>

    <!-- الطاقة -->
    <div class="energy-container">
        ⚡️ <span id="energyDisplay">1000</span> / 1000
    </div>

    <!-- دائرة النقر الأساسية -->
    <div class="clicker-btn" id="mainClicker">👆</div>

    <!-- قسم المهام -->
    <div class="tasks-section">
        <h3 style="margin-top:0; text-align:center;">المهام اليومية لزيادة الأرباح</h3>
        
        <!-- إعلان طاقة -->
        <div class="task-item">
            <div>
                <strong>شحن طاقة سريع ⚡️</strong><br>
                <small>شاهد إعلان لتربح 500 طاقة</small>
            </div>
            <button class="task-btn energy-btn" onclick="watchAdTask('energy', 500, 'رابط_adsterra_أو_hilltop_هنا')">شحن 500 ⚡️</button>
        </div>

        <!-- إعلان Adsterra -->
        <div class="task-item">
            <div>
                <strong>إعلان مميز (Adsterra) 🌟</strong><br>
                <small>شاهد إعلان واربح النقاط</small>
            </div>
            <button class="task-btn" onclick="watchAdTask('money', 6500, 'رابط_adsterra_الجديد_هنا')">اكسب 6500 💰</button>
        </div>

        <!-- إعلان HilltopAds -->
        <div class="task-item">
            <div>
                <strong>إعلان سريع (HilltopAds) 🚀</strong><br>
                <small>شاهد إعلان واربح النقاط</small>
            </div>
            <button class="task-btn" onclick="watchAdTask('money', 5000, 'https://plump-plastic.com/by3jVQ0.Pf3epBv/bDmiVSJ-ZMDt0y3aNkTVAv0DNfjPMJ3PLQT/c/1wM/DmQp2ONYDHEk')">اكسب 5000 💰</button>
        </div>

        <!-- الاشتراك بالقناة -->
        <div class="task-item">
            <div>
                <strong>انضم لقناتنا 📢</strong><br>
                <small>قناة Syclick الرسمية</small>
            </div>
            <button class="task-btn" onclick="joinChannel()">انضمام</button>
        </div>

        <!-- دعوة الأصدقاء -->
        <div class="task-item">
            <div>
                <strong>ادعُ 5 أصدقاء 🤝</strong><br>
                <small>لزيادة مستوى شعبيتك 🏆</small>
            </div>
            <button class="task-btn" style="background-color: #ff9800;" onclick="inviteFriends()">دعوة الأصدقاء</button>
        </div>

        <!-- زر السحب (مغلق مؤقتاً) -->
        <button class="task-btn withdraw-btn" onclick="alert('قسم السحب تحت الصيانة لضبط أفضل أسعار التحويل لكم قريباً!')">قسم سحب الأرباح 💳</button>
    </div>

    <!-- أكواد الجافاسكريبت للتشغيل -->
    <script>
        // المتغيرات الأساسية
        let balance = 0;
        let energy = 1000;
        let popularityLevel = 1;
        const requiredAdSeconds = 15; // عدد الثواني المطلوبة للتحقق من المشاهدة

        // تحديث الواجهة
        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toLocaleString();
            document.getElementById('energyDisplay').innerText = energy;
            document.getElementById('popLevel').innerText = popularityLevel;
        }

        // النقر على اللعبة
        document.getElementById('mainClicker').addEventListener('click', function() {
            if (energy > 0) {
                energy -= 1;
                balance += 10; // نعطيه القليل من الرصيد مع كل نقرة تشجيعاً
                updateUI();
            } else {
                alert("لقد نفدت طاقتك ⚡️! قم بمشاهدة إعلان لشحن 500 طاقة جديدة.");
            }
        });

        // دالة التحقق الذكي من الإعلانات
        function watchAdTask(type, reward, link) {
            // فتح الإعلان
            window.open(link, '_blank');
            
            let startTime = new Date().getTime();
            let hasReturned = false;

            // ننتظر عودة اللاعب للعبة لنتحقق من الوقت
            let checkTime = function() {
                if(hasReturned) return;
                hasReturned = true;

                let elapsedTime = (new Date().getTime() - startTime) / 1000;
                
                if (elapsedTime >= requiredAdSeconds) {
                    if (type === 'energy') {
                        energy = Math.min(1000, energy + reward);
                        alert("ممتاز! تمت إضافة " + reward + " ⚡️ إلى طاقتك بنجاح.");
                    } else if (type === 'money') {
                        balance += reward;
                        alert("رائع! تمت إضافة " + reward + " 💰 إلى رصيدك بنجاح.");
                    }
                    updateUI();
                } else {
                    alert("⚠️ عذراً! لقد عدت بسرعة كبيرة. يجب عليك البقاء في صفحة الإعلان لمدة " + requiredAdSeconds + " ثانية على الأقل لضمان استلام المكافأة.");
                }
                
                // إزالة المراقبة بعد الفحص
                window.removeEventListener('focus', checkTime);
            };

            // تفعيل المراقبة بعد ثانية واحدة من الضغط
            setTimeout(() => {
                window.addEventListener('focus', checkTime);
            }, 1000);
        }

        // الانضمام للقناة
        function joinChannel() {
            window.open('https://t.me/Syclickchannel', '_blank');
            // يمكننا برمجتها لاحقاً لتعطي نقطة شعبية مثلاً
        }

        // دعوة الأصدقاء
        function inviteFriends() {
            let inviteLink = "https://t.me/share/url?url=https://t.me/YourBotUsername&text=العب_واربح_مع_Syclick";
            window.open(inviteLink, '_blank');
            alert("عندما يدخل 5 أصدقاء من رابطك سيتم رفع مستوى شعبيتك 🏆!");
        }

        // التحديث الأولي عند فتح الصفحة
        updateUI();
    </script>
</body>
</html>
