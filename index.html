<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sy Click</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #131722 0%, #0d0f17 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      margin-top: 30px;
      text-align: center;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: #38ef7d;
      letter-spacing: 1px;
    }
    .score-container {
      margin-top: 15px;
      font-size: 42px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coin-icon {
      width: 40px;
      height: 40px;
      background: #f1c40f;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
    }
    .click-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .main-button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, #11998e 0%, #38ef7d 100%);
      border: 8px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(56, 239, 125, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      cursor: pointer;
      transition: transform 0.05s ease;
      touch-action: manipulation;
    }
    .main-button:active {
      transform: scale(0.93);
    }
    .actions {
      margin-bottom: 40px;
      width: 85%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-ad {
      background: linear-gradient(90deg, #ff9900 0%, #ff5500 100%);
      border: none;
      padding: 16px;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 85, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">Sy Click</div>
    <div class="score-container">
      <div class="coin-icon">⚡</div>
      <span id="score">0</span>
    </div>
  </div>

  <div class="click-area">
    <div class="main-button" id="clickBtn">🖱️</div>
  </div>

  <div class="actions">
    <button class="btn-ad" id="adBtn">
      <span>🎬 مشاهدة إعلان (+5000 نقطة)</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let score = parseInt(localStorage.getItem('syclick_score') || '0');
    const scoreElement = document.getElementById('score');
    const clickBtn = document.getElementById('clickBtn');
    const adBtn = document.getElementById('adBtn');

    scoreElement.textContent = score.toLocaleString();

    clickBtn.addEventListener('click', () => {
      score += 1;
      scoreElement.textContent = score.toLocaleString();
      localStorage.setItem('syclick_score', score);
    });

    adBtn.addEventListener('click', () => {
      alert("سيتم تفعيل عرض الإعلانات بمجرد إكمال الربط مع AdsGram!");
    });
  </script>
<!-- استدعاء مكتبة AdsGram -->
<script src="https://sad.adsgram.ai/js/sad.js"></script>
<script>
    // ربط معرف الإعلان الخاص بك
    const adController = window.Adsgram.init({ blockId: "52772" });
    
    // دالة تشغيل الإعلان
    function showRewardAd() {
        adController.show().then(() => {
            alert("تمت مشاهدة الإعلان بنجاح!");
        }).catch(() => {
            alert("لم تكتمل المشاهدة");
        });
    }
</script>

</body>
</html>
