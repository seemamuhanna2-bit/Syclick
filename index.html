
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sy Click</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #131722 0%, #0d0f17 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .score-box {
            font-size: 40px;
            font-weight: bold;
            color: #f3ba2f;
            margin: 15px 0;
        }
        .click-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
        }
        .click-btn {
            background: none;
            border: none;
            font-size: 85px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .click-btn:active {
            transform: scale(0.92);
        }
        .actions {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .btn-ad {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.4);
        }
        .btn-ad:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Sy Click</h2>
        <div class="score-box" id="score">0</div>
    </div>

    <div class="click-area">
        <button class="click-btn" id="clickBtn">🪙</button>
    </div>

    <div class="actions">
        <button class="btn-ad" id="adBtn">
            <span>🎬 مشاهدة إعلان (+5000 نقطة)</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let score = parseInt(localStorage.getItem('syclick_score') || '0', 10);
        const scoreElement = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const adBtn = document.getElementById('adBtn');

        scoreElement.textContent = score.toLocaleString();

        clickBtn.addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score.toLocaleString();
            localStorage.setItem('syclick_score', score);
        });

        // دالة لتحميل السكريبت برمجياً عند الطلب
        function loadAdsgramScript() {
            return new Promise((resolve, reject) => {
                if (window.Adsgram) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://sad.adsgram.ai/js/sad.js';
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('فشل جلب الملف من خوادم AdsGram'));
                document.head.appendChild(script);
            });
        }

        adBtn.addEventListener('click', async () => {
            adBtn.disabled = true;
            adBtn.innerText = "جاري الاتصال...";

            try {
                await loadAdsgramScript();
                const adController = window.Adsgram.init({ blockId: "52772", debug: true });
                const result = await adController.show();
                
                score += 5000;
                scoreElement.textContent = score.toLocaleString();
                localStorage.setItem('syclick_score', score);
                alert("مبروك! تمت إضافة 5000 نقطة إلى رصيدك.");
            } catch (err) {
                alert("نتيجة الطلب: " + (err.description || err.message || JSON.stringify(err)));
            } finally {
                adBtn.disabled = false;
                adBtn.innerText = "🎬 مشاهدة إعلان (+5000 نقطة)";
            }
        });
    </script>
</body>
</html>
