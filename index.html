
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Syclick - سايكليك</title>
  <!-- مكتبة Telegram WebApp الرسمية -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --accent: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* الترويسة ومعلومات الحساب */
    header {
      padding: 14px 18px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 17px;
    }

    .user-meta h3 {
      font-size: 14px;
      color: var(--text-main);
    }

    .user-meta span {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* المحتوى الرئيسي */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      position: relative;
      overflow-y: auto;
    }

    /* عداد الرصيد */
    .balance-wrapper {
      text-align: center;
      margin-top: 5px;
    }

    .balance-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .balance-amount {
      font-size: 38px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* منطقة النقر والعملة الكبيرة */
    .clicker-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 220px;
      height: 220px;
      margin: 10px 0;
    }

    .coin-btn {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706, #78350f);
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.35), inset 0 0 15px rgba(255, 255, 255, 0.3);
      border: 4px solid #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s ease;
      touch-action: manipulation;
    }

    .coin-btn:active {
      transform: scale(0.93);
    }

    .coin-inner-symbol {
      font-size: 70px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
    }

    /* الرقم العائم عند النقر */
    .floating-text {
      position: absolute;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);
      }
    }

    /* شريط الطاقة */
    .energy-bar-container {
      width: 100%;
      max-width: 320px;
      margin-bottom: 5px;
    }

    .energy-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.2s ease;
    }

    /* ========================================================= */
    /* 1. مساحة إعلان A-Ads التفاعلي داخل الواجهة                  */
    /* ========================================================= */
    .ad-banner-slot {
      width: 100%;
      max-width: 360px;
      min-height: 55px;
      background: rgba(22, 27, 34, 0.4);
      border: 1px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 8px 0;
      flex-shrink: 0;
    }

    /* شريط التنقل السفلي */
    nav {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      flex-shrink: 0;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 20px;
    }

    /* النوافذ المنبثقة (المهام والمكافآت) */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 20px;
      border-top: 1px solid var(--border);
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 18px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .task-card {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .task-info h4 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .task-reward {
      font-size: 12px;
      color: var(--primary);
      font-weight: bold;
    }

    .action-btn {
      background: var(--primary);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <!-- الترويسة -->
  <header>
    <div class="user-pill">
      <div class="avatar" id="avatarLetter">S</div>
      <div class="user-meta">
        <h3 id="userName">لاعب Syclick</h3>
        <span id="userLevel">المستوى 1</span>
      </div>
    </div>
    <div style="font-size: 12px; color: var(--success); font-weight: bold;">متصل 🟢</div>
  </header>

  <!-- مساحة اللعب الأساسية -->
  <main>
    <div class="balance-wrapper">
      <div class="balance-label">إجمالي العملات</div>
      <div class="balance-amount">
        <span>🪙</span>
        <span id="balance">0</span>
      </div>
    </div>

    <!-- العملة الكبيرة للنقر (مع رمز كيس النقود الجديد 💰) -->
    <div class="clicker-container" id="clickArea">
      <div class="coin-btn" id="coin">
        <div class="coin-inner-symbol">💰</div>
      </div>
    </div>

    <!-- شريط الطاقة بتصميمه وحركته السلسة -->
    <div class="energy-bar-container">
      <div class="energy-header">
        <span>الطاقة المتبقية</span>
        <span><strong id="energy">1000</strong> / 1000</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="energyBar"></div>
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- وحدة إعلانات A-Ads (الوحدة رقم 2458033 المعتمدة)          -->
    <!-- ========================================================= -->
    <div class="ad-banner-slot">
      <iframe data-aa='2458033' src='//acceptable.a-ads.com/2458033/?size=Adaptive' style='border:0px; padding:0; width:100%; height:100%; overflow:hidden; background-color: transparent;'></iframe>
    </div>
  </main>

  <!-- شريط التنقل السفلي -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('game')">
      <span class="nav-icon">🎮</span>
      <span>اللعبة</span>
    </button>
    <button class="nav-btn" onclick="openTasks()">
      <span class="nav-icon">📋</span>
      <span>المهام</span>
    </button>
    <button class="nav-btn" onclick="startAdWatch()">
      <span class="nav-icon">🎬</span>
      <span>مكافأة إعلان</span>
    </button>
  </nav>

  <!-- نافذة المهام المنبثقة -->
  <div class="modal" id="tasksModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>المهام والمكافآت</h2>
        <button class="close-btn" onclick="closeTasks()">&times;</button>
      </div>

      <!-- مهمة مشاهدة الإعلان المباشر -->
      <div class="task-card">
        <div class="task-info">
          <h4>مشاهدة إعلان مدعوم</h4>
          <div class="task-reward">+1,500 عملة 🪙</div>
        </div>
        <button class="action-btn" onclick="startAdWatch()">مشاهدة</button>
      </div>

      <!-- مهمة متابعة القناة -->
      <div class="task-card">
        <div class="task-info">
          <h4>الانضمام لقناتنا الرسمية</h4>
          <div class="task-reward">+5,000 عملة 🪙</div>
        </div>
        <button class="action-btn" onclick="completeTelegramTask()">انضمام</button>
      </div>

      <!-- تسجيل دخول يومي المحفوظ -->
      <div class="task-card">
        <div class="task-info">
          <h4>المكافأة اليومية</h4>
          <div class="task-reward">+2,000 عملة 🪙</div>
        </div>
        <button class="action-btn" id="dailyBtn" onclick="claimDaily()">استلام</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 2. إعداد رابط منصة Adsterra المباشر
    // =========================================================
    const ADSTERRA_DIRECT_LINK = "https://asiafilm.org/4/c3c6a248133c8cb9603460a7b6fa3eef";

    // تهيئة كائن تيليجرام
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // استرجاع البيانات المحلية المحفوظة
    let balance = parseInt(localStorage.getItem("sy_balance")) || 0;
    let energy = parseInt(localStorage.getItem("sy_energy")) || 1000;
    const maxEnergy = 1000;

    // عناصر الواجهة
    const balanceEl = document.getElementById("balance");
    const energyEl = document.getElementById("energy");
    const energyBar = document.getElementById("energyBar");
    const coinEl = document.getElementById("coin");
    const clickArea = document.getElementById("clickArea");

    // دالة تحديث الواجهة وتخزين الرصيد
    function updateUI() {
      balanceEl.innerText = balance.toLocaleString("en-US");
      energyEl.innerText = energy;
      energyBar.style.width = (energy / maxEnergy * 100) + "%";
      localStorage.setItem("sy_balance", balance);
      localStorage.setItem("sy_energy", energy);
    }
    updateUI();

    // جلب اسم اللاعب وصورته إن كان مسجلاً بتيليجرام
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const user = tg.initDataUnsafe.user;
      document.getElementById("userName").innerText = user.first_name || "لاعب";
      if (user.first_name) {
        document.getElementById("avatarLetter").innerText = user.first_name[0].toUpperCase();
      }
    }

    // معالجة النقر على العملة وتوليد الأرقام العائمة والاهتزاز
    coinEl.addEventListener("pointerdown", (e) => {
      if (energy <= 0) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
        return;
      }

      balance += 1;
      energy -= 1;
      updateUI();

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }

      createFloatingText(e.clientX, e.clientY);
    });

    function createFloatingText(x, y) {
      const el = document.createElement("div");
      el.className = "floating-text";
      el.innerText = "+1";

      const rect = clickArea.getBoundingClientRect();
      const localX = (x || rect.left + rect.width / 2) - rect.left;
      const localY = (y || rect.top + rect.height / 2) - rect.top;

      el.style.left = `${localX}px`;
      el.style.top = `${localY}px`;

      clickArea.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // استعادة شريط الطاقة تدريجياً كل ثانية
    setInterval(() => {
      if (energy < maxEnergy) {
        energy += 1;
        updateUI();
      }
    }, 1000);

    // =========================================================
    // نظام التحقق الصارم للإعلانات (حل مشكلة احتساب النقاط قبل الزيارة)
    // =========================================================
    let adWatchSessionActive = false;
    let adStartTime = 0;

    function startAdWatch() {
      // فتح رابط Adsterra المباشر
      window.open(ADSTERRA_DIRECT_LINK, "_blank");

      // تسجيل بدء الزيارة ووقتها
      adWatchSessionActive = true;
      adStartTime = Date.now();
    }

    // التحقق: لا يتم منح النقاط إلا بعد خروج اللاعب وعودته لواجهة التطبيق
    window.addEventListener("focus", () => {
      if (adWatchSessionActive) {
        adWatchSessionActive = false;
        const timeSpentAway = (Date.now() - adStartTime) / 1000;

        // اشتراط قضاء ثانيتين على الأقل في صفحة الإعلان لمنع النقرات الوهمية
        if (timeSpentAway >= 2) {
          balance += 1500;
          updateUI();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          alert("أحسنت! تمت مشاهدة الإعلان بنجاح، وأُضيفت 1,500 عملة إلى رصيدك 🪙🎉");
        } else {
          alert("يجب زيارة صفحة الإعلان لبضع ثوانٍ للحصول على المكافأة!");
        }
      }
    });

    // =========================================================
    // دوال النوافذ والمهام والمكافأة اليومية
    // =========================================================
    function openTasks() {
      document.getElementById("tasksModal").classList.add("active");
    }

    function closeTasks() {
      document.getElementById("tasksModal").classList.remove("active");
    }

    function completeTelegramTask() {
      window.open("https://t.me/your_channel", "_blank");
      setTimeout(() => {
        balance += 5000;
        updateUI();
        alert("تمت إضافة 5,000 عملة لانضمامك للقناة! 🎉");
      }, 2000);
    }

    function claimDaily() {
      const today = new Date().toDateString();
      const lastClaim = localStorage.getItem("sy_last_claim");

      if (lastClaim === today) {
        alert("لقد استلمت مكافأتك اليومية بالفعل، عُد غداً!");
        return;
      }

      balance += 2000;
      localStorage.setItem("sy_last_claim", today);
      updateUI();
      alert("تم استلام المكافأة اليومية بنجاح: +2,000 عملة! ✨");
    }

    function switchTab(tab) {
      if (tab === "game") closeTasks();
    }
  </script>
</body>
</html>
